<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Counter</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 12px; text-align: center; font: 17px -apple-system, sans-serif; background: #eee9df; color: #242424; }
  output { font-size: 40px; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 8px 16px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #076ccc; outline-offset: 3px; }
</style>
<output id="count" aria-live="polite">0</output>
<button type="button" id="increment">Add one</button>
<script>
(() => {
  let state = { count: 0 };
  const output = document.querySelector('#count');
  const draw = () => { output.value = String(state.count); };
  const save = () => window.webkit?.messageHandlers?.cork?.postMessage({ type: 'state', state });
  document.querySelector('#increment').onclick = () => {
    state.count = Math.min(999999, state.count + 1);
    draw(); save();
  };
  window.corkWidget = {
    restore(value = {}) {
      const count = Number.isSafeInteger(value.count) ? value.count : 0;
      state = { count: Math.max(0, Math.min(999999, count)) }; draw();
    },
    pause(paused) { /* No animation or background work to pause. */ }
  };
  draw();
})();
</script>
</html>
